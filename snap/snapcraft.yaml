name: git-sentinel
title: Git Sentinel
version: '0.2.0'
summary: Local-first desktop command center for your Git repositories
description: |
  Git Sentinel gives developers one calm, scannable place to see what is
  happening across the Git repositories already on their machine: the current
  branch, local working tree, branch upstream status, a project reference
  branch, and the latest commit.

  It observes Git. It never pulls, pushes, checks out, merges, rebases,
  resets, creates branches, stashes, or installs hooks, and it never modifies
  the repositories you register. Removing a repository from Git Sentinel
  removes only the saved entry, never the directory or its history.

  Git Sentinel reuses the Git, SSH, and credential configuration you already
  have on the machine. It runs the host `git`, can open a repository in your
  terminal emulator or file manager, and persists only its own preferences and
  the list of repository paths you added.

license: MIT
website: https://github.com/osamucadev/git-sentinel
source-code: https://github.com/osamucadev/git-sentinel
issues: https://github.com/osamucadev/git-sentinel/issues
contact: https://github.com/osamucadev/git-sentinel/issues

# classic confinement: Git Sentinel is a local-first developer tool. It must run
# the host `git` with the user's own configuration, credentials and SSH keys
# (~/.gitconfig, ~/.ssh, credential helpers), read `.git` metadata in
# repositories located anywhere on the filesystem (including outside $HOME and
# on other volumes), and launch the user's terminal emulator and file manager.
# No combination of strict-mode interfaces covers launching an arbitrary host
# terminal emulator or reading top-level home dotfiles, so strict confinement
# cannot support the product without bundling a second `git` and dropping core
# features.
base: core22
grade: stable
confinement: classic
compression: lzo

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

apps:
  git-sentinel:
    command: bin/git-sentinel
    common-id: com.gitsentinel.app

parts:
  git-sentinel:
    plugin: nil
    source: .
    build-snaps:
      - node/22/stable
      - rustup
    build-packages:
      - build-essential
      - curl
      - file
      - libgtk-3-dev
      - libjavascriptcoregtk-4.1-dev
      - librsvg2-dev
      - libsoup-3.0-dev
      - libssl-dev
      - libwebkit2gtk-4.1-dev
      - libxdo-dev
      - pkg-config
    override-build: |
      set -eu
      rustup default stable
      npm ci
      # Build through the Tauri CLI, exactly like the .deb / AppImage pipeline.
      # A bare `cargo build` leaves the `tauri/custom-protocol` feature off, so
      # `tauri-build` sets `dev = true` and the packaged binary loads `devUrl`
      # (http://localhost:1420) instead of the embedded `frontendDist` assets.
      # `--no-bundle` compiles the release binary but skips the deb/appimage
      # bundlers, which the Snap does not use. It runs `beforeBuildCommand`
      # (`npm run build`) itself. Trailing args after `--` go to cargo.
      npm run tauri -- build --no-bundle -- --locked
      install -Dm755 target/release/git-sentinel \
        "$CRAFT_PART_INSTALL/bin/git-sentinel"
      install -Dm644 src-tauri/icons/icon.png \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/512x512/apps/git-sentinel.png"
