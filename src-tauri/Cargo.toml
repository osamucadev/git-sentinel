[package]
name = "git-sentinel"
version = "0.1.0"
description = "Local-first desktop dashboard for your Git repositories"
authors = ["Git Sentinel"]
edition = "2021"

[lib]
name = "git_sentinel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
git-sentinel-core = { path = "../core" }
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
