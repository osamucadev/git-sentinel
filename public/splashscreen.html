<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Git Sentinel</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden; color: #e6f0fa; background: radial-gradient(circle at 15% 10%, #163757 0, transparent 36%), linear-gradient(145deg, #07111d, #0e2133); }
      main { width: min(100%, 440px); padding: 42px 46px; }
      .mark { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid #58d5f7; color: #58d5f7; transform: rotate(45deg); margin-bottom: 30px; box-shadow: 0 0 20px #2cc9f344; }
      .mark span { transform: rotate(-45deg); font-size: 16px; }
      p { margin: 0; }
      .name { color: #76dff8; font: 700 11px/1.2 ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 12px 0 9px; font-size: 27px; letter-spacing: -.04em; }
      .message { color: #a7bed0; font-size: 14px; }
      .bar { height: 3px; margin-top: 27px; overflow: hidden; background: #284256; }
      .bar::after { content: ""; display: block; width: 38%; height: 100%; background: linear-gradient(90deg, #46d5ec, #7ee6b0); animation: progress 1.1s ease-in-out infinite; }
      small { display: block; margin-top: 12px; color: #7f9ab0; font: 11px/1.3 ui-monospace, monospace; }
      @keyframes progress { from { transform: translateX(-115%); } to { transform: translateX(290%); } }
    </style>
  </head>
  <body><main><div class="mark"><span>◆</span></div><p class="name">Git Sentinel</p><h1>Preparing your headquarters</h1><p class="message">Restoring local repository state.</p><div class="bar"></div><small>Local-first · no remote fetch is running</small></main></body>
</html>
